services:
  web:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://floorplanner:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/floorplanner
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: floorplanner
      POSTGRES_USER: floorplanner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["open-event-cad-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floorplanner -d floorplanner"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  open-event-cad-data:
